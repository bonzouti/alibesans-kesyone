<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questionnaire : site de l'Association LibEsans</title>
<style>
:root {
  --bg: #f4f5fa;
  --surface: #ffffff;
  --ink: #1b2140;
  --muted: #565d7d;
  --line: #dde0ec;
  --accent: #b8650f;
  --accent-soft: #fbefe0;
  --focus: #2f4fd8;
  --ok: #1f7a4d;
  --warn: #9a5b00;
  --font-display: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --step--1: 0.875rem;
  --step-0: 1rem;
  --step-1: 1.2rem;
  --step-2: 1.55rem;
  --step-3: 2.1rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11142a; --surface: #191d39; --ink: #eceefa; --muted: #a4a9c8; --line: #2c3158;
    --accent: #f0ac52; --accent-soft: #2e2618; --focus: #8ea3ff; --ok: #5fcf96; --warn: #f0ac52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11142a; --surface: #191d39; --ink: #eceefa; --muted: #a4a9c8; --line: #2c3158;
  --accent: #f0ac52; --accent-soft: #2e2618; --focus: #8ea3ff; --ok: #5fcf96; --warn: #f0ac52;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: var(--step-0); line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 120px;
}
.wrap { max-width: 720px; margin: 0 auto; }
header.top { padding-block: 40px 24px; display: grid; gap: 14px; }
h1 { font-weight: 700; font-size: var(--step-2); line-height: 1.2; margin: 0; }
.intro { color: var(--muted); max-width: 62ch; margin: 0; }
.notice { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 14px 16px; font-size: var(--step--1); color: var(--muted); }
.progress-label { font-size: var(--step--1); color: var(--muted); }

section.block { padding-block: 28px; border-top: 1px solid var(--line); display: grid; gap: 22px; }
.block-head { display: grid; gap: 4px; }
.block-head h2 { font-weight: 700; font-size: var(--step-1); margin: 0; line-height: 1.3; }
.block-head p { margin: 0; color: var(--muted); }

.q { display: grid; gap: 8px; min-width: 0; }
.q > label, .q > .legend { font-weight: 700; }
.q .help { font-size: var(--step--1); color: var(--muted); margin-top: -4px; }
.q .req { color: var(--accent); margin-left: 4px; }
input[type="text"], input[type="email"], input[type="tel"], input[type="date"], textarea, select {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
textarea { min-height: 96px; resize: vertical; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, .opt input:focus-visible + span {
  outline: 2px solid var(--focus); outline-offset: 2px;
}
.opts { display: grid; gap: 8px; }
.opts.cols { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; min-width: 0; }
.opt input { margin-top: 4px; accent-color: var(--accent); flex: none; }
.opt span { min-width: 0; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt small { display: block; color: var(--muted); font-size: var(--step--1); }
.other { margin-top: 2px; }
.phases { display: grid; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.phase-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.phase-row:first-child { border-top: 0; }
.phase-name { min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 6px 12px; font-size: var(--step--1); font-weight: 700; color: var(--muted); white-space: nowrap; border-left: 1px solid var(--line); }
.seg label:first-child span { border-left: 0; }
.seg input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: -2px; }
.seg .seg-now input:checked + span { background: var(--accent); color: var(--surface); }
.seg .seg-later input:checked + span { background: var(--accent-soft); color: var(--ink); }
.seg .seg-no input:checked + span { background: var(--line); color: var(--ink); }
@media (max-width: 560px) {
  .phase-row { grid-template-columns: minmax(0, 1fr); }
  .seg { display: flex; }
  .seg label { flex: 1 1 0; min-width: 0; text-align: center; }
  .seg span { white-space: normal; padding: 6px 4px; height: 100%; display: flex; align-items: center; justify-content: center; }
}

.actions {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
}
.actions .inner { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.status { flex: 1 1 200px; font-size: var(--step--1); color: var(--muted); min-width: 0; }
.status.ok { color: var(--ok); }
.status.warn { color: var(--warn); }
.btn { font: inherit; font-weight: 700; border-radius: 8px; padding: 10px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn:disabled { opacity: 0.5; cursor: default; }

.owner { border: 1px solid var(--accent); border-radius: 12px; padding: 18px; background: var(--surface); display: grid; gap: 12px; margin-bottom: 8px; }
.owner[hidden] { display: none; }
.owner h2 { font-family: var(--font-display); font-size: var(--step-1); margin: 0; }
.owner .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
.owner .row .who { min-width: 0; }
.owner .row .meta { font-size: var(--step--1); color: var(--muted); }
.pill { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.pill.sent { color: var(--ok); }
.pill.draft { color: var(--warn); }
.owner pre { white-space: pre-wrap; font: inherit; font-size: var(--step--1); background: var(--bg); border-radius: 8px; padding: 12px; margin: 0; max-height: 420px; overflow: auto; }

@media (prefers-reduced-motion: no-preference) {
  .opt { transition: border-color 120ms, background-color 120ms; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1 data-t="title"></h1>
    <p class="intro" data-t="intro" data-html></p>
    <div class="notice" id="mode-notice" data-t="notice-copy" data-html></div>
    <div class="progress-label" id="progress-label"></div>
  </header>

  <div id="owner" class="owner" hidden></div>

  <form id="form" novalidate></form>
</div>

<div class="actions">
  <div class="inner">
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <button type="button" class="btn" id="btn-copy"></button>
    <button type="button" class="btn" id="btn-save" hidden></button>
    <button type="button" class="btn primary" id="btn-send" hidden></button>
  </div>
</div>

        { id: "site_existant", type: "text", t: { fr: "Un site existe-t-il déjà ? Son adresse" } },
        { id: "reseaux", type: "textarea", t: { fr: "Réseaux sociaux à relier au site" }, h: { fr: "Facebook, Instagram, TikTok, YouTube, LinkedIn… Indiquez les liens." } }
      ]
    },
    {
      id: "maj",
      t: { fr: "Mises à jour" },
      d: { fr: "Pour adapter l'outil d'édition et la formation." },
      q: [
        { id: "maj_qui", type: "text", t: { fr: "Qui publiera les actualités et annonces ?" } },
        { id: "maj_aisance", type: "radio", t: { fr: "Cette personne est-elle à l'aise avec l'informatique ?" },
          opts: [
            { v: "facile", fr: "Oui, elle gère déjà un site ou une page Facebook" },
            { v: "moyen", fr: "Elle peut apprendre avec une formation" },
            { v: "difficile", fr: "Non, nous préférerions déléguer" }
          ] },
        { id: "maj_frequence", type: "radio", t: { fr: "À quelle fréquence pensez-vous publier ?" },
          opts: [
            { v: "semaine", fr: "Chaque semaine" },
            { v: "mois", fr: "Quelques fois par mois" },
            { v: "rare", fr: "Rarement" }
          ] },
        { id: "connexion", type: "radio", t: { fr: "Depuis quoi l'équipe publiera-t-elle le plus souvent ?" },
          opts: [
            { v: "telephone", fr: "Un téléphone, en données mobiles" },
            { v: "ordinateur", fr: "Un ordinateur" },
            { v: "mixte", fr: "Les deux" }
          ] }
      ]
    },
    {
      id: "budget",
      t: { fr: "Délai et budget" },
      d: { fr: "Une fourchette suffit." },
      q: [
        { id: "date_souhaitee", type: "text", t: { fr: "Quand souhaitez-vous la mise en ligne ?" } },
        { id: "date_ferme", type: "radio", t: { fr: "Cette date est-elle impérative ?" },
          opts: [
            { v: "ferme", fr: "Oui" },
            { v: "souple", fr: "Non" }
          ] },
        { id: "budget_creation", type: "radio", t: { fr: "Budget de création du site (une fois, en USD)" },
          opts: [
            { v: "lt500", fr: "Moins de 500" },
            { v: "500_1000", fr: "500 à 1 000" },
            { v: "1000_2000", fr: "1 000 à 2 000" },
            { v: "2000_3500", fr: "2 000 à 3 500" },
            { v: "gt3500", fr: "Plus de 3 500" },
            { v: "inconnu", fr: "Pas encore fixé" }
          ] },
        { id: "budget_mensuel", type: "radio", t: { fr: "Budget mensuel pour l'entretien (mises à jour, sauvegardes, en USD)" },
          opts: [
            { v: "lt25", fr: "Moins de 25" },
            { v: "25_50", fr: "25 à 50" },
            { v: "50_100", fr: "50 à 100" },
            { v: "gt100", fr: "Plus de 100" },
            { v: "inconnu", fr: "Je ne sais pas encore" }
          ] }
      ]
    },
    {
      id: "autres",
      t: { fr: "Autres points" },
      d: { fr: "Ce que nous n'avons pas demandé et qui vous semble utile." },
      q: [
        { id: "libre", type: "textarea", t: { fr: "Questions, précisions, contraintes" } }
      ]
    }
  ];

  const STORAGE_KEY = "alibesans-kesyone-draft-v1";
  const lang = "fr";
  let answers = {};
  const DEVICE_KEY = "alibesans-kesyone-device-v1";
  let remote = false;
  let deviceId = null;
  // Relais d'envoi : chaque envoi arrive par courriel. GitHub Pages ne reçoit rien.
  const ENDPOINT = "https://formsubmit.co/ajax/pierremathieu18@gmail.com";
  let lastSaved = "";
  let sentAt = null;
  let saveInFlight = false;

  const $ = (id) => document.getElementById(id);
  const tr = (o) => (o ? (o[lang] ?? o.ht) : "");

  function loadLocal() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") {
          answers = parsed.answers || {};
          if (typeof parsed.sentAt === "string") sentAt = parsed.sentAt;
        }
      }
    } catch (e) { /* stockage indisponible : on continue sans */ }
  }
  function saveLocal() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ answers, lang, sentAt })); } catch (e) { /* ignoré */ }
  }
  // Identifiant aléatoire de l'appareil : un appareil, une ligne côté serveur.
  function loadDeviceId() {
    try {
      const known = localStorage.getItem(DEVICE_KEY);
      if (known) return known;
    } catch (e) { /* stockage indisponible : identifiant pour cette visite seulement */ }
    if (!window.crypto || typeof crypto.randomUUID !== "function") return null;
    const id = crypto.randomUUID();
    try { localStorage.setItem(DEVICE_KEY, id); } catch (e) { /* ignoré */ }
    return id;
  }

  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k === "text") n.textContent = v; else n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids) if (k) n.append(k);
    return n;
  }

  function renderForm() {
    const form = $("form");
    form.replaceChildren();
    SECTIONS.forEach((s, i) => {
      const sec = el("section", { class: "block", id: "s-" + s.id, "aria-labelledby": "h-" + s.id });
      sec.append(el("div", { class: "block-head" },
        el("h2", { id: "h-" + s.id, text: (i + 1) + ". " + tr(s.t) }),
        el("p", { text: tr(s.d) })
      ));
      s.q.forEach((q) => sec.append(renderQuestion(q)));
      form.append(sec);
    });
  }

  function renderQuestion(q) {
    const wrap = el("div", { class: "q" });
    const help = q.h ? el("div", { class: "help", id: "help-" + q.id, text: tr(q.h) }) : null;
    const reqMark = q.req ? el("span", { class: "req", "aria-hidden": "true", text: "*" }) : null;

    if (q.type === "phase") {
      const fs = el("fieldset", { style: "border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0" });
      fs.append(el("legend", { class: "legend", style: "padding:0;font-weight:700;margin-bottom:8px", text: tr(q.t) }));
      if (help) fs.append(help);
      const current = (answers[q.id] && typeof answers[q.id] === "object" && !Array.isArray(answers[q.id])) ? answers[q.id] : {};
      const list = el("div", { class: "phases" });
      q.opts.forEach((o) => {
        const name = q.id + "__" + o.v;
        const seg = el("div", { class: "seg", role: "radiogroup", "aria-label": tr(o) });
        PHASES.forEach((p) => {
          const id = "f-" + name + "-" + p.v;
          const input = el("input", { type: "radio", name, id, value: p.v });
          input.checked = current[o.v] === p.v;
          input.addEventListener("change", () => onPhaseChange(q, o.v, p.v));
          seg.append(el("label", { for: id, class: "seg-" + p.v }, input, el("span", { text: tr(p) })));
        });
        list.append(el("div", { class: "phase-row" }, el("span", { class: "phase-name", text: tr(o) }), seg));
      });
      fs.append(list);
      wrap.append(fs);
      return wrap;
    }

    if (q.type === "radio" || q.type === "check") {
      const fs = el("fieldset", { style: "border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0" });
      const legend = el("legend", { class: "legend", style: "padding:0;font-weight:700;margin-bottom:8px" }, document.createTextNode(tr(q.t)));
      if (q.max) legend.append(document.createTextNode(lang === "ht" ? " (" + q.max + " maksimòm)" : " (" + q.max + " au maximum)"));
      fs.append(legend);
      if (help) fs.append(help);
      const box = el("div", { class: "opts" + (q.cols ? " cols" : "") });
      const current = answers[q.id];
      q.opts.forEach((o) => {
        const id = "f-" + q.id + "-" + o.v;
        const input = el("input", { type: q.type === "radio" ? "radio" : "checkbox", name: q.id, id, value: o.v });
        if (q.type === "radio") input.checked = current === o.v;
        else input.checked = Array.isArray(current) && current.includes(o.v);
        input.addEventListener("change", () => onOptChange(q, input));
        box.append(el("label", { class: "opt", for: id }, input, el("span", { text: tr(o) })));
      });
      fs.append(box);
      if (q.other) fs.append(textInput(q.id + "_other", tr(UI.other), "other"));
      wrap.append(fs);
      return wrap;
    }

    const id = "f-" + q.id;
    const label = el("label", { for: id }, document.createTextNode(tr(q.t)));
    if (reqMark) label.append(reqMark);
    wrap.append(label);
    if (help) wrap.append(help);
    if (q.type === "textarea") {
      const ta = el("textarea", { id, name: q.id, "aria-describedby": help ? help.id : null });
      ta.value = answers[q.id] || "";
      ta.addEventListener("input", () => setAnswer(q.id, ta.value));
      wrap.append(ta);
    } else {
      const inp = el("input", { type: q.type === "text" ? "text" : q.type, id, name: q.id, placeholder: q.ph || null, "aria-describedby": help ? help.id : null, autocomplete: q.type === "email" ? "email" : (q.type === "tel" ? "tel" : null), required: q.req || null });
      inp.value = answers[q.id] || "";
      inp.addEventListener("input", () => setAnswer(q.id, inp.value));
      wrap.append(inp);
    }
    return wrap;
  }

  function textInput(key, placeholder, cls) {
    const inp = el("input", { type: "text", id: "f-" + key, name: key, placeholder, class: cls, "aria-label": placeholder });
    inp.value = answers[key] || "";
    inp.addEventListener("input", () => setAnswer(key, inp.value));
    return inp;
  }

  function onOptChange(q, input) {
    if (q.type === "radio") {
      setAnswer(q.id, input.value);
      return;
    }
    let arr = Array.isArray(answers[q.id]) ? answers[q.id].slice() : [];
    if (input.checked) {
      if (q.max && arr.length >= q.max) { input.checked = false; flash(lang === "ht" ? "Maksimòm " + q.max + " chwa." : q.max + " choix au maximum.", "warn"); return; }
      arr.push(input.value);
    } else {
      arr = arr.filter((v) => v !== input.value);
    }
    setAnswer(q.id, arr);
  }

  function onPhaseChange(q, opt, phase) {
    const cur = answers[q.id];
    const map = (cur && typeof cur === "object" && !Array.isArray(cur)) ? Object.assign({}, cur) : {};
    map[opt] = phase;
    setAnswer(q.id, map);
  }

  function setAnswer(key, value) {
    const empty = value === "" || (Array.isArray(value) && value.length === 0);
    if (empty) delete answers[key]; else answers[key] = value;
    saveLocal();
    updateProgress();
    if (remote) setStatus(tr(UI.draftLocal), "");
  }

  function sectionStarted(s) {
    return s.q.some((q) => answers[q.id] !== undefined || answers[q.id + "_other"] !== undefined);
  }
  function updateProgress() {
    const a = SECTIONS.filter(sectionStarted).length;
    $("progress-label").textContent = tr(UI.progress).replace("{a}", a).replace("{b}", SECTIONS.length);
  }

  function optLabel(q, v, l) {
    const o = (q.opts || []).find((x) => x.v === v);
    return o ? (o[l] ?? o.ht) : v;
  }
  function summaryText(ans, l) {
    const lines = [];
    const T = (o) => (o ? (o[l] ?? o.ht) : "");
    lines.push((l === "ht" ? "KESYONÈ SIT ENTÈNÈT · ASOSYASYON LIBESANS" : "QUESTIONNAIRE SITE WEB · ASSOCIATION LIBESANS"));
    SECTIONS.forEach((s, i) => {
      lines.push("", (i + 1) + ". " + T(s.t).toUpperCase());
      s.q.forEach((q) => {
        const v = ans[q.id];
        const other = ans[q.id + "_other"];
        let out = "";
        if (q.type === "phase") {
          const map = (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
          lines.push("- " + T(q.t));
          PHASES.forEach((p) => {
            const picked = q.opts.filter((o) => map[o.v] === p.v).map((o) => T(o));
            if (picked.length) lines.push("    " + T(p) + " : " + picked.join(", "));
          });
          const open = q.opts.filter((o) => !map[o.v]).map((o) => T(o));
          if (open.length) lines.push("    " + (l === "ht" ? "San repons" : "Sans réponse") + " : " + open.join(", "));
          return;
        }
        if (Array.isArray(v)) out = v.map((x) => optLabel(q, x, l)).join(", ");
        else if (v !== undefined) out = q.opts ? optLabel(q, v, l) : String(v);
        if (other) out = out ? out + " · " + other : other;
        lines.push("- " + T(q.t) + " : " + (out || "-"));
      });
    });
    return lines.join("\n");
  }

  async function copyAnswers() {
    const text = summaryText(answers, lang);
    try {
      await navigator.clipboard.writeText(text);
      flash(tr(UI.copied), "ok");
    } catch (e) {
      showFallback(text);
      flash(tr(UI.copyFail), "warn");
    }
  }
  function showFallback(text) {
    let ta = $("copy-fallback");
    if (!ta) {
      ta = el("textarea", { id: "copy-fallback", readonly: true, "aria-label": tr(UI.copy), style: "min-height:240px" });
      $("form").after(ta);
    }
    ta.value = text;
    ta.focus();
    ta.select();
  }

  let flashTimer = null;
  function setStatus(msg, kind) {
    const s = $("status");
    s.textContent = msg;
    s.className = "status" + (kind ? " " + kind : "");
  }
  function flash(msg, kind) {
    setStatus(msg, kind);
    clearTimeout(flashTimer);
  }

  function hasContact() {
    return (answers.contact_nom || "").trim() && ((answers.contact_tel || "").trim() || (answers.contact_email || "").trim());
  }

  async function saveRemote(send) {
    if (!remote || saveInFlight) return;
    if (send && !hasContact()) { flash(tr(UI.needContact), "warn"); $("f-contact_nom").focus(); return; }
    saveInFlight = true;
    $("btn-save").disabled = true; $("btn-send").disabled = true;
    flash(tr(UI.saving), "");
    const now = new Date().toISOString();
    if (send) sentAt = now;
    const payload = {
      _subject: "Kesyonè ALIBESANS : " + String(answers.contact_nom || "").trim(),
      _template: "box",
      _captcha: "false",
      contact: String(answers.contact_nom || "").trim(),
      appareil: deviceId,
      langue: lang,
      reponses: summaryText(answers, "fr"),
      donnees: JSON.stringify(answers)
    };
    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "content-type": "application/json", accept: "application/json" },
        body: JSON.stringify(payload)
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok || String(out.success) !== "true") throw new Error("HTTP " + res.status);
      lastSaved = JSON.stringify(answers);
      saveLocal();
      flash(send ? tr(UI.sent) : tr(UI.saved) + " · " + new Date().toLocaleTimeString(lang === "ht" ? "fr-HT" : "fr-FR", { hour: "2-digit", minute: "2-digit" }), "ok");
    } catch (e) {
      if (send) sentAt = null;
      flash(tr(UI.saveFail), "warn");
    } finally {
      saveInFlight = false;
      $("btn-save").disabled = false; $("btn-send").disabled = false;
    }
  }

  function applyStatic() {
    document.querySelectorAll("[data-t]").forEach((n) => {
      const key = n.getAttribute("data-t");
      if (n.hasAttribute("data-html")) n.innerHTML = tr(UI[key]); else n.textContent = tr(UI[key]);
    });
    $("btn-copy").textContent = tr(UI.copy);
    $("btn-save").textContent = tr(UI.save);
    $("btn-send").textContent = tr(UI.send);
  }

  // Vue propriétaire : liste des réponses reçues
  let ownerDocs = null;
  const openRows = new Set();
  function renderOwner(docs) {
    ownerDocs = docs;
    const box = $("owner");
    box.hidden = false;
    box.replaceChildren(el("h2", { text: tr(UI.ownerTitle) + " (" + docs.length + ")" }));
    if (!docs.length) { box.append(el("p", { class: "meta", style: "margin:0;color:var(--muted)", text: tr(UI.ownerEmpty) })); return; }
    docs.forEach((d) => {
      const data = d.data || {};
      const ans = (data.answers && typeof data.answers === "object") ? data.answers : {};
      const sent = data.status === "sent";
      const when = data.updatedAt ? new Date(data.updatedAt).toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" }) : "";
      const btn = el("button", { type: "button", class: "btn", text: openRows.has(d.id) ? tr(UI.hide) : tr(UI.view) });
      const row = el("div", { class: "row" },
        el("div", { class: "who" },
          el("div", { text: String(ans.contact_nom || "-") + (ans.contact_role ? " · " + ans.contact_role : "") }),
          el("div", { class: "meta" }, el("span", { class: "pill " + (sent ? "sent" : "draft"), text: sent ? tr(UI.statusSent) : tr(UI.statusDraft) }), document.createTextNode(" " + when))
        ),
        btn
      );
      box.append(row);
      if (openRows.has(d.id)) box.append(el("pre", { text: summaryText(ans, "fr") }));
      btn.addEventListener("click", () => { openRows.has(d.id) ? openRows.delete(d.id) : openRows.add(d.id); renderOwner(ownerDocs); });
    });
  }

  function connect() {
    deviceId = loadDeviceId();
    if (!deviceId) return;
    remote = true;

    $("mode-notice").setAttribute("data-t", "notice-db");
    applyStatic();
    $("btn-send").hidden = false;
  }

  $("btn-copy").addEventListener("click", copyAnswers);
  $("btn-save").addEventListener("click", () => saveRemote(false));
  $("btn-send").addEventListener("click", () => saveRemote(true));

  loadLocal();
  applyStatic();
  renderForm();
  updateProgress();
  connect();
})();
</script>
</body>
</html>
